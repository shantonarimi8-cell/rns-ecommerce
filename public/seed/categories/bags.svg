<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Bags">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(30,45%,95%)"/>
      <stop offset="100%" stop-color="hsl(55,40%,84%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(30,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="300" fill="url(#spot)"/>
  <g transform="translate(400 400) scale(1.25) translate(-200 -200)" filter="url(#shadow)">
    
      <path d="M135 165 Q200 40 265 165" stroke="#784b1f" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M80 165 L320 165 L350 380 L50 380 Z" fill="#b8732f" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M80 165 L320 165 L312 235 L88 235 Z" fill="#784b1f"/>
      <path d="M50 380 L350 380 L344 340 L56 340 Z" fill="#975e27"/>
      <circle cx="200" cy="245" r="16" fill="#d4a017" stroke="rgba(17,24,39,0.35)" stroke-width="3"/>
      <rect x="194" y="232" width="12" height="26" rx="4" fill="#9f741c"/>
      <line x1="88" y1="300" x2="312" y2="300" stroke="#784b1f" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
