<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(220,45%,90%)"/>
      <stop offset="100%" stop-color="hsl(245,40%,78%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(220,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="320" fill="url(#spot)"/>
  <circle cx="400" cy="440" r="250" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>
  <g transform="translate(400 440) rotate(-8) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <path d="M200 60 L340 130 L340 290 L200 360 L60 290 L60 130 Z" fill="#6b7280" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M200 60 L340 130 L200 200 L60 130 Z" fill="#666c7a" opacity="0.8"/>
      <path d="M200 200 L340 130 L340 290 L200 360 Z" fill="#4b505a"/>
      <line x1="200" y1="200" x2="200" y2="360" stroke="rgba(17,24,39,0.35)" stroke-width="3"/>
      <path d="M130 95 L270 165 L270 230 L130 160 Z" fill="#fff" opacity="0.5"/>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  <rect x="620" y="40" width="140" height="40" rx="20" fill="#111827" opacity="0.75"/><text x="690" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">Alt view</text>
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">New Product</text>
  <text x="400" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#6b7280">PLACEHOLDER</text>
