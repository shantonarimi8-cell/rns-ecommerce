<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(200,45%,95%)"/>
      <stop offset="100%" stop-color="hsl(225,40%,84%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(200,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="290" fill="url(#spot)"/>
  
  <g transform="translate(400 440) rotate(0) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <rect x="168" y="30" width="64" height="70" rx="8" fill="#266892" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <rect x="180" y="40" width="10" height="50" rx="4" fill="#fff" opacity="0.35"/>
      <rect x="184" y="100" width="32" height="34" fill="#d4a017" stroke="rgba(17,24,39,0.35)" stroke-width="3"/>
      <rect x="110" y="130" width="180" height="250" rx="34" fill="#3aa0e0" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <rect x="110" y="130" width="180" height="250" rx="34" fill="url(#glass)"/>
      <rect x="128" y="150" width="18" height="200" rx="9" fill="#fff" opacity="0.35"/>
      <rect x="148" y="222" width="104" height="76" rx="8" fill="#fffdf7" stroke="#266892" stroke-width="2"/>
      <text x="200" y="252" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#374151">RNS</text>
      <text x="200" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#6b7280">EAU DE PARFUM</text>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">Ocean Breeze Perfume</text>
  <text x="400" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#6b7280">OCEAN PERFUME</text>
</svg>
