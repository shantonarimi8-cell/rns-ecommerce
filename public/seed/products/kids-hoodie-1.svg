<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(220,45%,95%)"/>
      <stop offset="100%" stop-color="hsl(245,40%,84%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(220,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="290" fill="url(#spot)"/>
  
  <g transform="translate(400 440) rotate(0) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <path d="M110 90 L290 90 L345 180 L290 200 L290 370 L110 370 L110 200 L55 180 Z" fill="#8a8f99" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M135 95 Q200 -10 265 95 Q200 60 135 95 Z" fill="#61646b" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M160 95 Q200 50 240 95 Q200 130 160 95 Z" fill="#45484d"/>
      <rect x="145" y="270" width="110" height="70" rx="12" fill="#61646b" opacity="0.6"/>
      <line x1="185" y1="110" x2="180" y2="200" stroke="#fff" stroke-width="4"/>
      <line x1="215" y1="110" x2="220" y2="200" stroke="#fff" stroke-width="4"/>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">Kids Hoodie</text>
