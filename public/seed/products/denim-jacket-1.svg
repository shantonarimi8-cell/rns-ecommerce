<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(225,45%,95%)"/>
      <stop offset="100%" stop-color="hsl(250,40%,84%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(225,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="290" fill="url(#spot)"/>
  
  <g transform="translate(400 440) rotate(0) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <path d="M100 70 L160 40 L200 110 L240 40 L300 70 L350 160 L295 180 L295 370 L105 370 L105 180 L50 160 Z" fill="#3b4a8c" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M160 40 L200 110 L185 200 L150 110 Z" fill="#26305b"/>
      <path d="M240 40 L200 110 L215 200 L250 110 Z" fill="#26305b"/>
      <line x1="200" y1="110" x2="200" y2="370" stroke="#26305b" stroke-width="4"/>
      <rect x="125" y="150" width="50" height="40" rx="4" fill="#35437e" stroke="#26305b" stroke-width="3"/>
      <rect x="225" y="150" width="50" height="40" rx="4" fill="#35437e" stroke="#26305b" stroke-width="3"/>
      <rect x="105" y="330" width="190" height="40" fill="#26305b" opacity="0.7"/>
      <circle cx="214" cy="220" r="6" fill="#d4a017"/><circle cx="214" cy="260" r="6" fill="#d4a017"/><circle cx="214" cy="300" r="6" fill="#d4a017"/>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">Denim Jacket</text>
  <text x="400" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#6b7280">DENIM JACKET</text>
