<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(210,45%,90%)"/>
      <stop offset="100%" stop-color="hsl(235,40%,78%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(210,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="320" fill="url(#spot)"/>
  <circle cx="400" cy="440" r="250" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>
  <g transform="translate(400 440) rotate(-8) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <path d="M140 150 C140 60 260 60 260 150" stroke="#313740" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M90 150 L310 150 L330 380 L70 380 Z" fill="#4b5563" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <rect x="90" y="150" width="220" height="22" fill="#313740"/>
      <path d="M150 150 C150 110 250 110 250 150" stroke="#fff" stroke-width="6" fill="none" opacity="0.4"/>
      <text x="200" y="285" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="40" fill="#fff" opacity="0.9">RNS</text>
      <rect x="110" y="310" width="180" height="4" fill="#fff" opacity="0.5"/>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  <rect x="620" y="40" width="140" height="40" rx="20" fill="#111827" opacity="0.75"/><text x="690" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">Alt view</text>
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">City Tote Bag</text>
  <text x="400" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#6b7280">TOTE BAG</text>
