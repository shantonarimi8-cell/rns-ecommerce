<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(150,45%,95%)"/>
      <stop offset="100%" stop-color="hsl(175,40%,84%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(150,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="290" fill="url(#spot)"/>
  
  <g transform="translate(400 440) rotate(0) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <rect x="80" y="50" width="240" height="340" rx="10" fill="#2f9e62" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <line x1="120" y1="70" x2="120" y2="350" stroke="#216f45" stroke-width="2" opacity="0.6"/><line x1="150" y1="70" x2="150" y2="350" stroke="#216f45" stroke-width="2" opacity="0.6"/><line x1="180" y1="70" x2="180" y2="350" stroke="#216f45" stroke-width="2" opacity="0.6"/><line x1="210" y1="70" x2="210" y2="350" stroke="#216f45" stroke-width="2" opacity="0.6"/><line x1="240" y1="70" x2="240" y2="350" stroke="#216f45" stroke-width="2" opacity="0.6"/><line x1="270" y1="70" x2="270" y2="350" stroke="#216f45" stroke-width="2" opacity="0.6"/>
      <path d="M80 50 L320 50 L320 170 Q200 230 80 110 Z" fill="#288653"/>
      <rect x="80" y="350" width="240" height="40" fill="#d4a017"/>
      <rect x="80" y="360" width="240" height="4" fill="#fff" opacity="0.6"/>
      <rect x="80" y="376" width="240" height="4" fill="#fff" opacity="0.6"/>
      <rect x="300" y="50" width="20" height="340" fill="#d4a017"/>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">Cotton Saree</text>
  <text x="400" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#6b7280">COTTON SAREE</text>
</svg>
