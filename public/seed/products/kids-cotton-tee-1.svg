<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(0,45%,95%)"/>
      <stop offset="100%" stop-color="hsl(25,40%,84%)"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="hsl(0,40%,30%)" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="440" r="290" fill="url(#spot)"/>
  
  <g transform="translate(400 440) rotate(0) scale(1.1) translate(-200 -200)" filter="url(#shadow)">
    
      <path d="M100 60 L160 30 Q200 72 240 30 L300 60 L350 140 L290 170 L290 370 L110 370 L110 170 L50 140 Z" fill="#e23b3b" stroke="rgba(17,24,39,0.35)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M160 30 Q200 72 240 30 Q200 100 160 30 Z" fill="#aa2c2c" opacity="0.6"/>
      <line x1="110" y1="170" x2="110" y2="370" stroke="#aa2c2c" stroke-width="3" opacity="0.4"/>
      <line x1="290" y1="170" x2="290" y2="370" stroke="#aa2c2c" stroke-width="3" opacity="0.4"/>
  </g>
  <text x="40" y="70" font-family="Georgia,serif" font-weight="bold" font-size="28" fill="#8b1a4a" opacity="0.8">RNS</text>
  
  <text x="400" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#1f2937">Kids Cotton Tee</text>
  <text x="400" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#6b7280">KIDS COTTON TEE</text>
</svg>
